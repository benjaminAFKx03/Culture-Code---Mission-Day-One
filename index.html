}

.berry{display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;gap:10px}

.placebar{display:none}
@media (max-width:899px),(pointer:coarse){
  .placebar{display:grid;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -12px 30px var(--shadow-strong);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .placebar > *{width:100%;max-width:900px;margin-inline:auto}
  body.has-bar{padding-bottom:320px}
  body.has-bar .tour{display:none}
  body.has-bar .toasts{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
}
.pb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pb-text{font-size:.875rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb-grid{display:grid;gap:8px}
.pb-grid.n3,.pb-grid.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
.pb-grid.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.pb-grid .btn{white-space:normal;line-height:1.15;min-height:52px;font-size:.875rem;padding:8px 6px;overflow-wrap:break-word;hyphens:auto}
.picker-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.picker-list{grid-template-columns:1fr}}
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 14px 34px var(--shadow-strong);max-width:calc(100% - 32px)}
.tour .t-label{font-size:.875rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tour .ibtn{background:transparent;color:var(--bg);border-color:transparent;width:40px;height:40px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;box-shadow:0 12px 30px var(--shadow-strong);font-size:.9375rem;transition:opacity .3s ease,transform .3s ease}
.toast-alert{background:var(--alert);color:var(--on-accent)}
.toast-ok{background:var(--ok);color:var(--on-accent)}
.toast-gold{background:var(--gold);color:var(--on-accent)}
.toast.out{opacity:0;transform:translateY(8px)}

/* Administration */
.admin-band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:repeating-linear-gradient(135deg,var(--admin-soft) 0 14px,var(--surface) 14px 28px);border:1.5px solid var(--admin);border-radius:16px;padding:12px 16px;margin-top:clamp(14px,2.5vw,24px)}
.admin-band strong{color:var(--admin);font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase;font-size:.8125rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.jump-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.jump-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:400px){.jump-grid{grid-template-columns:1fr}}
button.card.jump{display:grid;gap:4px;padding:14px 16px}
.j-name{font-family:var(--font-display);font-stretch:condensed;font-size:1.3125rem;font-weight:700;text-transform:uppercase;line-height:1.05}
.j-sub{font-size:.8125rem;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.set-grid{grid-template-columns:1fr}}
.set{display:grid;gap:10px;align-content:start}
.set h3{font-size:1.375rem;font-weight:700;text-transform:uppercase}
.bignum{font-family:var(--font-display);font-stretch:condensed;font-size:2.125rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.editor{display:grid;gap:10px}
.editor details{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.editor summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid transparent;border-radius:14px;min-height:48px}
.editor summary::-webkit-details-marker{display:none}
.editor .fields{display:grid;gap:14px;padding:4px 16px 16px}
.field{display:grid;gap:6px}
.field label{font-size:.8125rem;color:var(--muted);font-weight:600}
.savebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1.5px solid var(--gold);border-radius:16px;padding:10px 14px;box-shadow:0 12px 30px var(--shadow-strong)}
.pw-error{color:var(--alert);font-size:.875rem}
.gm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.gm-grid{grid-template-columns:1fr}}
.gm-list{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:.875rem}
.bp{display:grid;gap:clamp(18px,3vw,28px)}
.bp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.bp-grid{grid-template-columns:1fr}}
.bp-card{display:grid;gap:12px;align-content:start}
.bp-card h3{font-size:1.625rem;font-weight:800;text-transform:uppercase}
.bp-card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.flow li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.flow .num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:8px}
code{font-family:var(--font-mono);font-size:.875em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media print{.top,.hud,.toasts,#layer{display:none!important}}


/* 3D world (version 0.4): stage, HUD over the picture, touch controls */
body.mode-3d{overflow:hidden;padding-bottom:0;overscroll-behavior:none}
body.mode-3d .top,body.mode-3d .hud{position:relative;top:auto}
.main-3d{height:0;overflow:hidden}
.stage{position:fixed;left:0;right:0;bottom:0;top:var(--stage-top,128px);z-index:10;background:#0C1118;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;color:#E6EBF3}
.stage[hidden]{display:none!important}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab;touch-action:none}
.stage.locked canvas{cursor:none}
.w-cross{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid rgba(255,255,255,.88);box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none;transition:transform .12s ease,background-color .12s ease}
.w-cross.on{background:#F7C548;border-color:#F7C548;transform:scale(1.4)}
.stage:not(.locked):not(.touch) .w-cross{display:none}
.w-glass{background:rgba(12,17,24,.86);color:#E6EBF3;border:1px solid rgba(255,255,255,.16);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.w-glass .eyebrow{color:#9AA6B8}
.w-loc{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;width:min(400px,calc(100% - 24px));max-height:calc(100% - 210px);overflow:auto;overscroll-behavior:contain;touch-action:pan-y}
.w-loc summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;min-height:44px}
.w-loc summary::-webkit-details-marker{display:none}
.w-loc summary::after{content:"▾";margin-left:auto;color:#9AA6B8}
.w-loc details[open] summary::after{content:"▴"}
.loc-room{font-family:var(--font-display);font-stretch:condensed;font-weight:800;font-size:1.25rem;text-transform:uppercase;line-height:1}
.loc-st{font-size:.875rem;color:#CDD5E1}
.loc-body{display:grid;gap:10px;padding:0 14px 14px;font-size:.875rem;line-height:1.45}
.loc-body .msg{color:#111827}
.loc-body .src-foot{color:#9AA6B8;border-top-color:rgba(255,255,255,.2)}
.loc-body .src-foot strong{color:#E6EBF3}
.loc-body .linkbtn{color:#A9BEFF}
.loc-body .tag{background:transparent;color:#CDD5E1;border-color:rgba(255,255,255,.3)}
.loc-body .tag-ok,.w-loc summary .tag-ok{background:#11703F;color:#FFFFFF;border-color:transparent}
.loc-status{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.05em;color:#F7C548}
.loc-ins{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.loc-ins ul{margin:0;padding-left:18px;display:grid;gap:4px}
.w-carry{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;width:min(340px,calc(100% - 24px));padding:10px 12px;display:grid;gap:6px}
.w-carry[hidden]{display:none}
.w-carry .cp-t{font-weight:600;font-size:.9375rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.w-carry .btn{color:#111827}
.w-focus{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100% - 24px));padding:12px 16px;display:grid;gap:4px;pointer-events:none;max-height:40%;overflow:hidden}
.w-focus[hidden]{display:none}
.stage.touch .w-focus{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
.f-title{font-family:var(--font-display);font-stretch:condensed;font-weight:800;font-size:1.375rem;text-transform:uppercase;line-height:1.05}
.f-text{font-size:.9375rem;color:#CDD5E1;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.f-hint{font-weight:700;color:#F7C548;font-size:.9375rem;display:flex;align-items:center;gap:8px;margin-top:2px}
.f-hint.off{color:#9AA6B8;font-weight:600}
.kbd{font-family:var(--font-mono);font-size:.75rem;border:1px solid rgba(247,197,72,.65);border-radius:6px;padding:1px 6px;white-space:nowrap}
.w-joy{position:absolute;left:84px;top:calc(100% - 84px - env(safe-area-inset-bottom,0px));width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);pointer-events:none;display:none}
.stage.touch .w-joy{display:block}
.w-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.6)}
.w-act{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:2px solid #F7C548;background:rgba(20,22,27,.78);color:#F7C548;font-weight:800;font-size:.9375rem;display:none;touch-action:manipulation;cursor:pointer}
.stage.touch .w-act{display:grid;place-items:center}
.w-act.on{background:#F7C548;color:#14161B}
.w-lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,17,.5);padding:16px;cursor:pointer}
.w-lock[hidden]{display:none}
.lock-card{max-width:540px;padding:22px;display:grid;gap:12px;text-align:left;cursor:default}
.lock-card h2{font-size:clamp(1.75rem,5vw,2.5rem);font-weight:800;text-transform:uppercase}
.lock-card ul{margin:0;padding-left:18px;display:grid;gap:4px;color:#CDD5E1;font-size:.9375rem}
.lock-card .btn{color:#111827}
.lock-card .btn-primary{background:#F7C548;border-color:#F7C548;color:#14161B}
.w-nogl{position:absolute;inset:16px;display:grid;place-items:center}
.w-nogl[hidden]{display:none}
body.mode-3d .toasts{left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;width:min(380px,calc(100% - 32px));top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (pointer:coarse),(max-width:760px){body.mode-3d .toasts{left:12px;right:12px;width:auto;bottom:auto;top:calc(var(--stage-top,110px) + 64px)}}
@media (max-width:760px){
  body.mode-3d .areas,body.mode-3d .btn-fb,body.mode-3d .brand-sub,body.mode-3d .prog{display:none}
  body.mode-3d .top-in{padding-top:6px;padding-bottom:6px}
  body.mode-3d .hud-in{padding-top:6px;padding-bottom:6px}
  .w-loc{max-height:calc(100% - 250px)}
  .w-carry{top:64px;left:12px;right:12px;width:auto}
  .f-text{-webkit-line-clamp:3}
}


/* Version 0.5: tools, speech bubbles, intro title, dialogue box, character creator */
.w-tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;gap:8px;z-index:3}
.w-tool{display:inline-flex;align-items:center;gap:6px;min-height:42px;min-width:42px;justify-content:center;padding:6px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(12,17,24,.8);color:#E6EBF3;font-weight:700;font-size:.8125rem;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.w-tool:hover{border-color:#F7C548}
.w-tool[aria-pressed="false"]{color:#9AA6B8}
.w-carry{top:64px}
.w-bubble{position:absolute;left:0;top:0;max-width:260px;background:#FFFFFF;color:#111827;border-radius:16px;padding:8px 12px;font-size:.875rem;line-height:1.35;box-shadow:0 10px 24px rgba(0,0,0,.3);pointer-events:none;z-index:2}
.w-bubble strong{display:block;font-family:var(--font-mono);font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:#2350D6}
.w-bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#FFFFFF;border-bottom:0}
.w-bubble[hidden]{display:none}
.w-title{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:6px;color:#FFFFFF;opacity:0;pointer-events:none;transition:opacity .6s ease;text-shadow:0 4px 24px rgba(0,0,0,.6);background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.25),rgba(0,0,0,0) 60%)}
.w-title.on{opacity:1;pointer-events:auto;cursor:pointer}
.w-title h2{font-size:clamp(2.75rem,9vw,6rem);font-weight:800;text-transform:uppercase;line-height:.9}
.w-title .eyebrow{color:#F7C548;letter-spacing:.24em}
.stage.creator .w-loc,.stage.creator .w-focus,.stage.creator .w-carry,.stage.creator .w-cross,.stage.creator .w-joy,.stage.creator .w-act,.stage.creator .w-bubble,.stage.creator .w-lock,.stage.creator .w-tools button:first-child{display:none!important}
.w-cr{display:none}
.stage.creator .w-cr{display:grid;position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:16px;bottom:16px;width:min(440px,calc(100% - 32px));grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;z-index:4}
.cr-head{padding:18px 18px 10px;display:grid;gap:6px;border-bottom:1px solid rgba(255,255,255,.12)}
.cr-head h2{font-size:clamp(1.5rem,3.4vw,2.125rem);font-weight:800;text-transform:uppercase;line-height:1}
.cr-head .small{color:#CDD5E1}
.cr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cr-chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#E6EBF3;font-weight:700;cursor:pointer;font-size:.875rem}
.cr-chip.on{background:#F7C548;color:#14161B;border-color:#F7C548}
.cr-chip.add{border-style:dashed}
.cr-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.cr-scroll{overflow:auto;padding:14px 18px;display:grid;gap:14px;align-content:start;overscroll-behavior:contain;touch-action:pan-y}
.cr-scroll input{background:rgba(255,255,255,.95);color:#111827}
.cr-lab{font-family:var(--font-mono);font-size:.6875rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9AA6B8}
.cr-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px}
.cr-tab{min-height:40px;border:0;border-radius:9px;background:transparent;color:#CDD5E1;font-weight:700;cursor:pointer;font-size:.875rem}
.cr-tab.on{background:#FFFFFF;color:#111827}
.cr-row{display:grid;gap:8px}
.cr-sw{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer;box-shadow:inset 0 -6px 10px rgba(0,0,0,.18);transition:transform .12s ease}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:#F7C548;box-shadow:0 0 0 3px rgba(247,197,72,.35),inset 0 -6px 10px rgba(0,0,0,.18)}
.cr-tx{display:flex;flex-wrap:wrap;gap:6px}
.cr-tx .btn{background:rgba(255,255,255,.08);color:#E6EBF3;border-color:rgba(255,255,255,.18)}
.cr-tx .btn.on{background:#F7C548;color:#14161B;border-color:#F7C548}
.cr-priv{color:#9AA6B8}
.cr-foot{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.12)}
.cr-foot .btn{color:#111827}
.cr-foot .btn-primary{background:#F7C548;border-color:#F7C548;color:#14161B}
@media (max-width:760px){
  .stage.creator .w-cr{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:58%}
  .cr-head{padding:12px 14px 8px}.cr-head .small{display:none}
  .sw{width:34px;height:34px}
}
/* dialogue box */
.overlay.talk-ov{align-items:end;background:linear-gradient(to top,rgba(8,11,17,.75),rgba(8,11,17,.15) 55%,rgba(8,11,17,0));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.talk{position:relative;width:min(900px,100%);display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;padding:18px;align-items:start;border-radius:22px}
.talk-pic{width:170px;height:170px;border-radius:18px;overflow:hidden;background:#1C2230;border:2px solid rgba(247,197,72,.6)}
.talk-pic img{width:100%;height:100%;display:block}
.talk-body{display:grid;gap:8px;min-width:0;padding-right:36px}
.talk h2{font-size:clamp(1.5rem,3.6vw,2.125rem);font-weight:800;text-transform:uppercase;line-height:1}
.talk-text{font-size:1.0625rem;line-height:1.5;color:#F1F4F8;min-height:3em}
.talk-text .tw-rest{opacity:0}
.talk-ask{font-weight:700;color:#F7C548}
.talk-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:4px}
.talk-opt{display:grid;gap:2px;text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#FFFFFF;font-weight:700;cursor:pointer;font-size:.9375rem}
.talk-opt small{font-weight:500;color:#CDD5E1;font-size:.75rem}
.talk-opt:hover,.talk-opt:focus-visible{background:#F7C548;color:#14161B;border-color:#F7C548}
.talk-opt:hover small,.talk-opt:focus-visible small{color:#3B2606}
.talk-opt.ghost{background:transparent}
.talk-x{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.1);color:#FFFFFF;border-color:rgba(255,255,255,.2)}
@media (max-width:640px){
  .talk{grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px}
  .talk-pic{width:72px;height:72px;border-radius:14px}
  .talk-opts{grid-template-columns:1fr 1fr}
  .talk-text{font-size:.9375rem}
}

body.mode-3d .toasts{left:50%;right:auto;transform:translateX(-50%);width:min(440px,calc(100% - 32px));top:calc(var(--stage-top,128px) + 14px);bottom:auto}
@media (max-width:1100px){body.mode-3d .toasts{top:calc(var(--stage-top,110px) + 64px)}}
.talk-opt{min-width:0;overflow-wrap:anywhere}
@media (max-width:760px){
  .w-tool span{display:none}
  .w-tool{padding:6px 10px}
  .w-loc{width:calc(100% - 24px - 104px)}
}
@media (max-width:640px){
  .talk{display:block;padding:14px}
  .talk-pic{float:left;width:64px;height:64px;margin:0 12px 6px 0}
  .talk-body{padding-right:40px;display:block}
  .talk-body>*{margin-bottom:6px}
  .talk-text{clear:both;padding-top:4px}
  .talk-opts{clear:both;grid-template-columns:1fr 1fr}
  .talk-opt{font-size:.875rem;padding:8px 10px;min-height:44px}

  function boardroomCheck() { if (state.codes.r1 && state.codes.r2) toast(t('toastBoardOpen'), 'gold'); }

    state.fails[id] = (state.fails[id] || 0) + 1;

    if (costly) addEvent('fail', PTS.fail, id);

  }

      var right = items.filter(function (it) { return s.placed[it.id] === answerOf(id, it); }).length;
      if (right === items.length) solved(id, id === 'r1s1' ? 'msgR1S1ok' : 'msgR2S1ok');
      else { items.forEach(function (it) { if (s.placed[it.id] === answerOf(id, it) && s.locked.indexOf(it.id) < 0) s.locked.push(it.id); }); failCheck(id, 'msgSortFail', { right: right, total: items.length }); }
